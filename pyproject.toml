[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seatalloc"
version = "1.0.0"
description = "Automated Event Seat Allocation Engine — heap-based waitlists, seat caps and CSV attendee manifests."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ayushman Maurya", email = "ayushman@example.com" }]
keywords = ["python", "heapq", "priority-queue", "data-structures", "algorithms", "waitlist", "csv"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
seatalloc = "seatalloc.cli:main"

[project.urls]
Homepage = "https://github.com/<your-handle>/seatalloc"
Issues = "https://github.com/<your-handle>/seatalloc/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: empirical timing tests (deselect with '-m \"not slow\"')"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
