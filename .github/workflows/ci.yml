name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src/seatalloc
      - name: Fast test suite (unit + property + stateful)
        run: pytest -q -m "not slow"
      - name: Empirical complexity tests
        run: pytest -q tests/test_complexity.py

  demo:
    name: demo + replay determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run the guided demo
        run: PYTHONPATH=src python -m seatalloc demo --out /tmp/demo
      - name: Replay the audit log and check every invariant
        run: PYTHONPATH=src python -m seatalloc verify /tmp/demo/devx26_audit.jsonl
      - name: Re-export from the log and diff against the original CSVs
        run: |
          PYTHONPATH=src python -m seatalloc export /tmp/demo/devx26_audit.jsonl --out /tmp/rebuilt --stem devx26
          diff /tmp/demo/devx26_manifest.csv /tmp/rebuilt/devx26_manifest.csv
          echo "manifest reproduced byte-for-byte from the audit log ✅"
      - name: Smoke-test the web demo (stdlib only)
        run: |
          python webapp/server.py &
          SERVER=$!
          for _ in $(seq 1 20); do curl -sf http://localhost:8000/healthz && break || sleep 0.5; done
          curl -sf -X POST http://localhost:8000/api/scenario -d '{}' > /dev/null
          curl -sf http://localhost:8000/api/state | python3 -c "import json,sys; s=json.load(sys.stdin); print('confirmed', s['stats']['confirmed'], 'waitlisted', s['stats']['waitlisted'])"
          curl -sf http://localhost:8000/api/export/manifest.csv | head -2
          kill $SERVER
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: /tmp/demo

  benchmark:
    name: benchmark (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run benchmarks
        run: PYTHONPATH=src python -m seatalloc bench --out docs/BENCHMARKS.md
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            docs/BENCHMARKS.md
            benchmarks/results.json
